[project]
name = "cadintent-workspace"
version = "0.0.0"
description = "Workspace root for the cadintent monorepo (not a published package)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["kernel", "conformance", "backends/dxf"]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.71.0",
    "pytest>=8",
    "hypothesis>=6",
]

[tool.pytest.ini_options]
testpaths = ["kernel/tests", "conformance/tests", "backends/dxf/tests"]
