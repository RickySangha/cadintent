[project]
name = "cadintent"
version = "0.0.1"
description = "cadintent kernel: validate / fold / diff over design-intent command streams"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jsonschema>=4.21",
]

[project.scripts]
cadintent = "cadintent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadintent"]
